name: Custom ROM - LineageOS Build

on:
  workflow_dispatch:
    inputs:
      ROM_MANIFEST:
        description: 'LineageOS Manifest URL'
        required: true
        default: 'https://github.com/LineageOS/android.git'
      ROM_BRANCH:
        description: 'LineageOS Branch (e.g., lineage-20.0, lineage-21.0)'
        required: true
        default: 'lineage-20.0'
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/XTENSEI/android_device_tecno_KJ5.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'lineage-23.2'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/tecno/KJ5'
      KERNEL_TREE:
        description: 'Kernel Tree URL'
        required: true
        default: 'https://github.com/XTENSEI/android_device_tecno_KJ5-kernel.git'
      KERNEL_TREE_BRANCH:
        description: 'Kernel Tree Branch'
        required: true
        default: 'lineage-23.0'
      KERNEL_PATH:
        description: 'Specify your Kernel Path'
        required: true
        default: 'kernel/tecno/KJ5'
      VENDOR_TREE:
        description: 'Vendor Tree URL'
        required: true
        default: 'https://github.com/XTENSEI/android_vendor_tecno_KJ5.git'
      VENDOR_TREE_BRANCH:
        description: 'Vendor Tree Branch'
        required: true
        default: 'lineage-23.2'
      VENDOR_PATH:
        description: 'Specify your Vendor Path'
        required: true
        default: 'vendor/tecno/KJ5'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'KJ5'
      BUILD_TYPE:
        description: 'Build Type'
        required: true
        default: 'eng'
        type: choice
        options:
        - userdebug
        - eng
        - user

jobs:
  build:
    name: Build LineageOS by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up Runner Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16
        
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip aria2
        
    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync ROM Source
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/rom
        cd ${GITHUB_WORKSPACE}/rom
        
        # Identity Configurations
        git config --global user.name "xoo2001"
        git config --global user.email "ekora2001@gmail.com"
        
        # Bypasses non-interactive auth prompts by injecting your token automatically
        git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        
        # Initialize LineageOS source code tree manifests
        repo init --depth=1 --no-repo-verify --git-lfs -u ${{ github.event.inputs.ROM_MANIFEST }} -b ${{ github.event.inputs.ROM_BRANCH }}
        
        # Syncing source files with optimization flags
        repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

    - name: Clone Device, Kernel, and Vendor Trees
      run: |
        cd ${GITHUB_WORKSPACE}/rom
        
        # Clone Device Tree
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        
        # Clone Kernel Tree (If provided)
        if [ ! -z "${{ github.event.inputs.KERNEL_TREE }}" ]; then
          git clone ${{ github.event.inputs.KERNEL_TREE }} -b ${{ github.event.inputs.KERNEL_TREE_BRANCH }} ./${{ github.event.inputs.KERNEL_PATH }}
        fi
        
        # Clone Vendor Tree (If provided)
        if [ ! -z "${{ github.event.inputs.VENDOR_TREE }}" ]; then
          git clone ${{ github.event.inputs.VENDOR_TREE }} -b ${{ github.event.inputs.VENDOR_TREE_BRANCH }} ./${{ github.event.inputs.VENDOR_PATH }}
        fi
        
        cd ./${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Setup CCACHE
      run: |
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        mkdir -p $HOME/.ccache

    - name: Building LineageOS ROM
      run: |
        cd ${GITHUB_WORKSPACE}/rom
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # Modern AOSP configuration standard layout structure
        # Syntax breakdown: lunch <product_makefile_name> <release_config> <build_variant>
        lunch lineage_${{ github.event.inputs.DEVICE_NAME }} trunk_staging ${{ github.event.inputs.BUILD_TYPE }}
        
        # Standard LineageOS build invocation target command
        mka bacon -j$(nproc --all)

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/rom
        # Search dynamically for generated target Lineage zip packages
        ROM_ZIP=$(find out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ -maxdepth 1 -name "lineage-*.zip" ! -name "*target_files*" | head -n 1)
        echo "ROM_ZIP_PATH=$ROM_ZIP" >> $GITHUB_ENV
        if [ -f "$ROM_ZIP" ]; then
          echo "MD5_ZIP=$(md5sum $ROM_ZIP | cut -d ' ' -f 1)" >> $GITHUB_ENV
        fi

    - name: Upload ROM to GitHub Releases
      uses: softprops/action-gh-release@v1
      if: env.ROM_ZIP_PATH != ''
      with:
        files: |
          rom/${{ env.ROM_ZIP_PATH }}
        name: LineageOS for tecno ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## LineageOS Unofficial Build Successful
          * **Source Code Branch:** `${{ github.event.inputs.ROM_BRANCH }}`
          * **Device path destination:** `${{ github.event.inputs.DEVICE_PATH }}`
          * **Tree Commit Target:** [${{ env.COMMIT_ID }}](${{ github.event.inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
          
          ### MD5 Verification Checksum
          * `${{ env.MD5_ZIP }}`
